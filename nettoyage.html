<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nettoyage cuisine</title>
<meta name="theme-color" content="#0C0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nettoyage">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0E13;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);--txt:#F2F3F5;--txt2:#B4B8C2;--txt3:#7C8190;--acc:#FFC72C;--grn:#34D399;--grn-d:rgba(52,211,153,.14);--org:#FB923C;--org-d:rgba(251,146,60,.14);--red:#F87171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;background-image:radial-gradient(120% 50% at 50% -8%,rgba(255,199,44,.10) 0%,transparent 60%)}
body.embed{background:transparent;background-image:none;min-height:0}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
body.embed .wrap{padding:0 0 10px}
.num{font-family:'Space Grotesk','DM Sans',sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ttl{font-weight:700;font-size:1.05rem;color:var(--acc);display:flex;align-items:center;gap:8px}
.site-name{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sites button{font:inherit;font-weight:700;font-size:.92rem;padding:12px 6px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--txt2);cursor:pointer}
.sites button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
.week{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.wk-row{display:flex;align-items:center;gap:10px}
.wk-arrow{font:inherit;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--txt);font-size:1.1rem;cursor:pointer;flex:0 0 auto}
.wk-arrow:disabled{opacity:.25}
.wk-mid{flex:1;text-align:center}
.wk-n{font-size:1.5rem;font-weight:700;line-height:1.1}
.wk-d{font-size:.85rem;color:var(--txt2);margin-top:2px}
.wk-now{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;color:var(--acc);background:rgba(255,199,44,.12);padding:3px 9px;border-radius:20px;cursor:pointer;border:0;font-family:inherit}
.prog{margin-top:14px}
.prog-txt{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;color:var(--txt2);margin-bottom:6px}
.prog-txt b{font-size:1.25rem;color:var(--txt)}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn);border-radius:6px;transition:width .3s}
.banner{border-radius:12px;padding:12px 14px;font-weight:600;font-size:.92rem;margin-bottom:12px;line-height:1.35}
.banner.o{background:var(--org-d);color:var(--org);border:1px solid rgba(251,146,60,.3)}
.banner.g{background:var(--grn-d);color:var(--grn);border:1px solid rgba(52,211,153,.3)}
.banner.p{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--bd)}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters button{font:inherit;font-weight:600;font-size:.85rem;padding:9px 14px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--txt2);cursor:pointer}
.filters button.on{background:rgba(255,255,255,.12);color:var(--txt);border-color:rgba(255,255,255,.2)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;margin-bottom:9px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s}
.item.done{background:var(--grn-d);border-color:rgba(52,211,153,.35)}
.item.ro{cursor:default}
.ph{width:84px;height:84px;border-radius:12px;flex:0 0 auto;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:var(--txt3);font-size:.68rem;gap:2px;cursor:pointer}
.ph.has{border:0}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cam{font-size:1.5rem}
.info{flex:1;min-width:0}
.nm{font-weight:700;font-size:1.02rem;line-height:1.25}
.st{font-size:.8rem;color:var(--txt3);margin-top:4px}
.item.done .st{color:var(--grn);font-weight:600}
.chk{width:52px;height:52px;border-radius:14px;border:2.5px solid rgba(255,255,255,.3);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:700;color:transparent;transition:all .15s}
.item.done .chk{background:var(--grn);border-color:var(--grn);color:#062016}
.empty{text-align:center;color:var(--txt3);padding:30px 10px;font-size:.92rem}
.foot{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btn{font:inherit;font-weight:700;font-size:.95rem;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--txt);cursor:pointer;width:100%}
.btn.acc{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
.btn.sm{font-size:.82rem;padding:10px;color:var(--txt3);background:transparent}
/* édition */
.ed{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ed input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--txt)}
.ed button{font:inherit;width:40px;height:42px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--txt2);cursor:pointer;flex:0 0 auto}
.ed button.del{color:var(--red)}
.hint{font-size:.8rem;color:var(--txt3);margin-bottom:12px;line-height:1.4}
/* visionneuse */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.on{display:flex}
.ov img{max-width:100%;max-height:68vh;border-radius:14px}
.ov .ov-nm{font-weight:700;font-size:1.1rem;margin:14px 0}
.ov .ov-b{display:flex;gap:8px;width:100%;max-width:420px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:#1f2430;border:1px solid var(--bd);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:.88rem;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top"><div class="ttl">🧽 Nettoyage cuisine</div></div>
  <div class="sites" id="sites"></div>
  <div class="site-name" id="siteName"></div>
  <div id="main"></div>
</div>

<div class="ov" id="ov">
  <img id="ovImg" alt="">
  <div class="ov-nm" id="ovNm"></div>
  <div class="ov-b">
    <button class="btn acc" onclick="ovChange()">📷 Changer la photo</button>
    <button class="btn" onclick="ovClose()">Fermer</button>
  </div>
</div>
<input type="file" id="file" accept="image/*" capture="environment" style="display:none" onchange="photoChosen(event)">
<div class="toast" id="toast"></div>

<script>
// ================= NETTOYAGE CUISINE (ES5) =================
var LS='nett_v1',LS_PH='nett_photos';
var SITES=[['GD','Gland'],['NC','Nyon Centre'],['ND','Nyon Drive']];
var DEF_EQ=['Friteuses','Grills','Toasters','Armoires de maintien (UHC)','Hotte et filtres','Tables de préparation','Frigos sous-comptoir','Chambre froide','Congélateur','Machine à glace','Machine à boissons','Machine à glaçons','Machine à café (McCafé)','Lave-vaisselle / plonge'];
var JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];

var params=parseQS();
var LOCK=params.site&&siteName(params.site)?params.site:null; // mode équipier
var EMBED=params.embed==='1';
var curSite=LOCK||readPref()||'GD';
var weekOff=0;          // 0 = semaine en cours, -1 = semaine passée...
var filter='all';
var editMode=false;
var photoTarget=null,ovTarget=null;

if(EMBED)document.body.className='embed';

function parseQS(){var o={},q=location.search.replace(/^\?/,'').split('&'),i,p;for(i=0;i<q.length;i++){if(!q[i])continue;p=q[i].split('=');o[decodeURIComponent(p[0])]=decodeURIComponent((p[1]||'').replace(/\+/g,' '))}return o}
function siteName(k){for(var i=0;i<SITES.length;i++){if(SITES[i][0]===k)return SITES[i][1]}return ''}
function readPref(){try{return localStorage.getItem('nett_site')}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function pad(n){return n<10?'0'+n:''+n}
function uid(){return 'e'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36)}

// ---------- dates ----------
function monday(off){var d=new Date();d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+7*(off||0));return d}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dm(d){return pad(d.getDate())+'.'+pad(d.getMonth()+1)}
function isoWeek(d){var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());t.setDate(t.getDate()+3-((t.getDay()+6)%7));var w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

// ---------- stockage ----------
function load(){
  var o;try{o=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){o=null}
  if(!o||typeof o!=='object')o={};
  if(!o.eq||typeof o.eq!=='object')o.eq={};
  if(!o.done||typeof o.done!=='object')o.done={};
  var i,j;
  for(i=0;i<SITES.length;i++){
    var k=SITES[i][0];
    if(!Array.isArray(o.eq[k])){o.eq[k]=[];for(j=0;j<DEF_EQ.length;j++)o.eq[k].push({id:k+'_'+j,nom:DEF_EQ[j]})}
  }
  return o;
}
function save(o){
  // purge > 26 semaines
  var lim=ymd(monday(-26)),k;
  for(k in o.done){if(o.done.hasOwnProperty(k)&&k.split('|')[1]<lim)delete o.done[k]}
  try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){toast('Mémoire pleine')}
  try{if(window.parent&&window.parent!==window&&window.parent.nettBadge)window.parent.nettBadge()}catch(e2){}
}
function photos(){try{return JSON.parse(localStorage.getItem(LS_PH)||'{}')||{}}catch(e){return {}}}
function savePhotos(p){try{localStorage.setItem(LS_PH,JSON.stringify(p));return true}catch(e){toast('Mémoire pleine — photo non enregistrée');return false}}
function wkKey(){return curSite+'|'+ymd(monday(weekOff))}

// ---------- rendu ----------
function render(){
  var o=load(),eq=o.eq[curSite],done=o.done[wkKey()]||{},ph=photos();
  var mon=monday(weekOff),sun=addDays(mon,6),isCur=weekOff===0;
  var nDone=0,i;
  for(i=0;i<eq.length;i++){if(done[eq[i].id])nDone++}
  var reste=eq.length-nDone;

  // sites
  var sh='';
  if(!LOCK){for(i=0;i<SITES.length;i++)sh+='<button class="'+(SITES[i][0]===curSite?'on':'')+'" onclick="setSite(\''+SITES[i][0]+'\')">'+esc(SITES[i][1])+'</button>'}
  document.getElementById('sites').innerHTML=sh;
  document.getElementById('sites').style.display=LOCK?'none':'grid';
  document.getElementById('siteName').textContent=siteName(curSite);
  if(EMBED)document.getElementById('top').style.display='none';

  if(editMode){renderEdit(eq);return}

  var h='<div class="week"><div class="wk-row">';
  h+='<button class="wk-arrow" onclick="shiftWeek(-1)" aria-label="Semaine précédente">◀</button>';
  h+='<div class="wk-mid"><div class="wk-n num">Semaine '+isoWeek(mon)+'</div>';
  h+='<div class="wk-d">Lun '+dm(mon)+' → Dim '+dm(sun)+'.'+sun.getFullYear()+'</div>';
  if(!isCur)h+='<button class="wk-now" onclick="shiftWeek(0)">↺ Revenir à cette semaine</button>';
  h+='</div><button class="wk-arrow" onclick="shiftWeek(1)" '+(isCur?'disabled':'')+' aria-label="Semaine suivante">▶</button></div>';
  h+='<div class="prog"><div class="prog-txt"><span><b class="num">'+nDone+' / '+eq.length+'</b> nettoyés</span><span>'+(reste?reste+' à faire':'Terminé ✓')+'</span></div>';
  h+='<div class="bar"><i style="width:'+(eq.length?Math.round(nDone/eq.length*100):0)+'%"></i></div></div></div>';

  var dow=new Date().getDay();
  if(!isCur)h+='<div class="banner p">Semaine passée — consultation seulement.</div>';
  else if(eq.length&&!reste)h+='<div class="banner g">Tout est nettoyé cette semaine 👏</div>';
  else if(dow===5||dow===6||dow===0)h+='<div class="banner o">Fin de semaine : <b>'+reste+'</b> équipement'+(reste>1?'s':'')+' pas encore nettoyé'+(reste>1?'s':'')+'.</div>';

  h+='<div class="filters"><button class="'+(filter==='all'?'on':'')+'" onclick="setFilter(\'all\')">Tout ('+eq.length+')</button>';
  h+='<button class="'+(filter==='todo'?'on':'')+'" onclick="setFilter(\'todo\')">Reste à faire ('+reste+')</button></div>';

  var shown=0;
  for(i=0;i<eq.length;i++){
    var e=eq[i],t=done[e.id];
    if(filter==='todo'&&t)continue;
    shown++;
    var src=ph[e.id];
    h+='<div class="item'+(t?' done':'')+(isCur?'':' ro')+'" onclick="toggle(\''+e.id+'\')">';
    h+='<div class="ph'+(src?' has':'')+'" onclick="event.stopPropagation();tapPhoto(\''+e.id+'\')">'+(src?'<img src="'+src+'" alt="">':'<span class="cam">📷</span><span>Photo</span>')+'</div>';
    h+='<div class="info"><div class="nm">'+esc(e.nom)+'</div>';
    h+='<div class="st">'+(t?'✓ Fait '+fmtTs(t):'Pas encore fait')+'</div></div>';
    h+='<div class="chk">✓</div></div>';
  }
  if(!eq.length)h+='<div class="empty">Aucun équipement. Ajoute-les avec « Modifier la liste ».</div>';
  else if(!shown)h+='<div class="empty">Rien à faire, tout est nettoyé ✓</div>';

  h+='<div class="foot"><button class="btn acc" onclick="shareBilan()">📤 Envoyer le bilan de la semaine</button>';
  if(!LOCK)h+='<button class="btn sm" onclick="setEdit(true)">⚙️ Modifier la liste des équipements</button>';
  h+='</div>';
  document.getElementById('main').innerHTML=h;
  resizeParent();
}
function fmtTs(ts){var d=new Date(ts);return JOURS[d.getDay()]+' '+dm(d)+' à '+pad(d.getHours())+':'+pad(d.getMinutes())}

function renderEdit(eq){
  var h='<div class="hint">Liste de <b>'+esc(siteName(curSite))+'</b>. Change les noms, l’ordre (↑ ↓), supprime ou ajoute. Les photos se prennent directement sur la liste.</div>';
  for(var i=0;i<eq.length;i++){
    h+='<div class="ed"><input value="'+esc(eq[i].nom)+'" onchange="rename(\''+eq[i].id+'\',this.value)">';
    h+='<button onclick="move(\''+eq[i].id+'\',-1)" '+(i===0?'disabled':'')+'>↑</button>';
    h+='<button onclick="move(\''+eq[i].id+'\',1)" '+(i===eq.length-1?'disabled':'')+'>↓</button>';
    h+='<button class="del" onclick="removeEq(\''+eq[i].id+'\')">🗑</button></div>';
  }
  h+='<div class="ed"><input id="newEq" placeholder="Nouvel équipement…" onkeydown="if(event.keyCode===13)addEq()"><button onclick="addEq()" style="width:auto;padding:0 14px;color:var(--acc)">＋</button></div>';
  h+='<div class="foot"><button class="btn acc" onclick="setEdit(false)">✓ Terminé</button></div>';
  document.getElementById('main').innerHTML=h;
  resizeParent();
}

// ---------- actions ----------
function setSite(k){curSite=k;try{localStorage.setItem('nett_site',k)}catch(e){}render()}
function shiftWeek(d){weekOff=d===0?0:Math.min(0,weekOff+d);render()}
function setFilter(f){filter=f;render()}
function setEdit(b){editMode=b;render()}

function toggle(id){
  if(weekOff!==0)return;
  var o=load(),k=wkKey();
  if(!o.done[k])o.done[k]={};
  if(o.done[k][id]){
    if(!confirm('Décocher cet équipement ?'))return;
    delete o.done[k][id];
  }else{
    o.done[k][id]=Date.now();
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  }
  save(o);render();
}
function findEq(o,id){var eq=o.eq[curSite];for(var i=0;i<eq.length;i++){if(eq[i].id===id)return i}return -1}
function rename(id,v){var o=load(),i=findEq(o,id);v=String(v||'').replace(/^\s+|\s+$/g,'');if(i<0||!v)return;o.eq[curSite][i].nom=v.slice(0,60);save(o)}
function move(id,d){var o=load(),eq=o.eq[curSite],i=findEq(o,id),j=i+d;if(i<0||j<0||j>=eq.length)return;var t=eq[i];eq[i]=eq[j];eq[j]=t;save(o);render()}
function removeEq(id){
  var o=load(),i=findEq(o,id);if(i<0)return;
  if(!confirm('Supprimer « '+o.eq[curSite][i].nom+' » ?'))return;
  o.eq[curSite].splice(i,1);save(o);
  var p=photos();if(p[id]){delete p[id];savePhotos(p)}
  render();
}
function addEq(){
  var el=document.getElementById('newEq'),v=String(el.value||'').replace(/^\s+|\s+$/g,'');if(!v)return;
  var o=load();o.eq[curSite].push({id:curSite+'_'+uid(),nom:v.slice(0,60)});save(o);render();
  var n=document.getElementById('newEq');if(n)n.focus();
}

// ---------- photos ----------
function tapPhoto(id){
  var p=photos();
  if(p[id]){
    var o=load(),i=findEq(o,id);
    ovTarget=id;
    document.getElementById('ovImg').src=p[id];
    document.getElementById('ovNm').textContent=i>=0?o.eq[curSite][i].nom:'';
    document.getElementById('ov').className='ov on';
  }else{
    photoTarget=id;document.getElementById('file').click();
  }
}
function ovClose(){document.getElementById('ov').className='ov';ovTarget=null}
function ovChange(){photoTarget=ovTarget;ovClose();document.getElementById('file').click()}
function photoChosen(ev){
  var f=ev.target.files&&ev.target.files[0];ev.target.value='';
  if(!f||!photoTarget)return;
  var id=photoTarget;photoTarget=null;
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=480,w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var p=photos();p[id]=c.toDataURL('image/jpeg',0.62);
      if(savePhotos(p)){toast('Photo enregistrée');render()}
    };
    img.onerror=function(){toast('Image illisible')};
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}

// ---------- bilan ----------
function shareBilan(){
  var o=load(),eq=o.eq[curSite],done=o.done[wkKey()]||{},mon=monday(weekOff),sun=addDays(mon,6);
  var faits=[],reste=[],i;
  for(i=0;i<eq.length;i++){if(done[eq[i].id])faits.push(eq[i].nom);else reste.push(eq[i].nom)}
  var t='🧽 Nettoyage '+siteName(curSite)+' — Semaine '+isoWeek(mon)+' ('+dm(mon)+' → '+dm(sun)+')\n';
  t+='Fait : '+faits.length+' / '+eq.length+'\n';
  if(reste.length){t+='\nReste à faire :\n';for(i=0;i<reste.length;i++)t+='• '+reste[i]+'\n'}
  else t+='\nTout est fait ✓\n';
  if(navigator.share){navigator.share({text:t})['catch'](function(){});return}
  copyText(t);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Bilan copié')},function(){prompt('Copie le bilan :',t)});return}
  prompt('Copie le bilan :',t);
}

// ---------- divers ----------
var tTo=null;
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.className='toast on';clearTimeout(tTo);tTo=setTimeout(function(){el.className='toast'},1800)}
function resizeParent(){
  if(!EMBED)return;
  setTimeout(function(){try{if(window.parent&&window.parent.nettResize)window.parent.nettResize(document.documentElement.scrollHeight)}catch(e){}},30);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
render();
</script>
</body>
</html>
